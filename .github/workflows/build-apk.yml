name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk geomat-attendance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geomat-attendance-apk
          path: geomat-attendance.apk

      # برنچ‌ها و PRها: APK در پیش‌ریلیز ثابت «preview» گذاشته می‌شود تا قبل از ادغام روی گوشی تست شود
      # (لینک همیشه یکی است: releases/download/preview/geomat-attendance.apk)
      - name: Publish preview APK (before merge)
        if: github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh release delete preview --cleanup-tag -y || true
          gh release create preview geomat-attendance.apk --prerelease --target "$TARGET_SHA" \
            --title "پیش‌نمایش (قبل از ادغام)" \
            --notes "نسخه آزمایشی ادغام‌نشده از ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} (${TARGET_SHA:0:7}). فقط برای تست؛ نسخه رسمی بعد از ادغام منتشر می‌شود."

      # فقط main ریلیز رسمی می‌سازد
      - name: Attach APK to GitHub Release v1.2.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.2.0 >/dev/null 2>&1 || gh release create v1.2.0 --title "v1.2.0" --notes "No default companies: each site is added on location with its GPS position; live entry needs the site location; location always on. Geofence per site, open entry + exit reminder, monthly report with overtime, backup/restore, support checklists, offline send queue, entry GPS location, in-app Jalali calendar, chat delete fix." || true
          gh release upload v1.2.0 geomat-attendance.apk --clobber || true
