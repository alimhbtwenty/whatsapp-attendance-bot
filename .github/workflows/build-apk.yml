name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk geomat-attendance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geomat-attendance-apk
          path: geomat-attendance.apk

      - name: Attach APK to GitHub Release v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.2 geomat-attendance.apk --clobber || true
