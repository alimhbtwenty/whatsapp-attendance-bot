name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      # کلید امضای ثابت (GitHub Secrets). ریلیز رسمی main بدون آن ساخته نمی‌شود، چون APK با
      # کلید تصادفی روی نسخه نصب‌شده نصب نمی‌شود؛ برنچ‌ها/PRها در نبودش با کلید debug ساخته می‌شوند.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/geomat-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/geomat-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are missing; refusing to publish a randomly signed release."
            exit 1
          else
            echo "::warning::Signing secrets missing: this build is debug-signed and will not install over the released app."
          fi

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Verify APK signature
        if: env.KEYSTORE_FILE != ''
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          KEY=$(keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias geomat | grep -o 'SHA-256): .*' | cut -d' ' -f2 | tr -d ':')
          APKSIG=$(keytool -printcert -jarfile "$APK" | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':')
          echo "key $KEY / apk $APKSIG"
          [ -n "$KEY" ] && [ "$KEY" = "$APKSIG" ] || { echo "::error::APK is not signed with the release key"; exit 1; }

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk geomat-attendance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geomat-attendance-apk
          path: geomat-attendance.apk

      # برنچ‌ها و PRها: APK در پیش‌ریلیز ثابت «preview» گذاشته می‌شود تا قبل از ادغام روی گوشی تست شود
      # (لینک همیشه یکی است: releases/download/preview/geomat-attendance.apk)
      - name: Publish preview APK (before merge)
        if: github.ref != 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh release delete preview --cleanup-tag -y || true
          gh release create preview geomat-attendance.apk --prerelease --target "$TARGET_SHA" \
            --title "پیش‌نمایش (قبل از ادغام)" \
            --notes "نسخه آزمایشی ادغام‌نشده از ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} (${TARGET_SHA:0:7}). فقط برای تست؛ نسخه رسمی بعد از ادغام منتشر می‌شود."

      # فقط main ریلیز رسمی می‌سازد
      - name: Attach APK to GitHub Release v1.4.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.4.0 >/dev/null 2>&1 || gh release create v1.4.0 --title "v1.4.0" --notes "Support tab: per-company technical file (network/domain, accessible systems, AnyDesk/RustDesk remotes, ESXi hosts, servers/VMs, apps, users) with a personal login per person (admin: full control; technician: view, add, edit, no delete), append-only history with who/when/what and restore for the admin, passwords encrypted with a team key (PBKDF2 + AES-GCM), domain/workgroup/ESXi filters and search; overtime and deficit by office hours (09-17, Thursday 09-14, Fridays and holidays all overtime, travel between sites is not a deficit); exit message no longer repeats the entry time; v1.2 split entry/exit records merged into one record per stay; staff-name checkbox removed. Greeting and date only on the first message of the day; no location in WhatsApp messages; entry and exit of a stay are one archive record, and an exit pairs with its entry from the archive; reports are posted to the in-app messenger; messenger fits the screen with the keyboard open. No default companies: each site is added on location with its GPS position; live entry needs the site location; location always on. Geofence per site, open entry + exit reminder, monthly report with overtime, backup/restore, support checklists, offline send queue, entry GPS location, in-app Jalali calendar, chat delete fix." || true
          gh release upload v1.4.0 geomat-attendance.apk --clobber || true
