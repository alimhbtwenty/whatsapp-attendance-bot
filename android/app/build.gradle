plugins {
    id 'com.android.application'
}

android {
    namespace 'com.geomatco.attendance'
    compileSdk 34

    defaultConfig {
        applicationId "com.geomatco.attendance"
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // کلید امضای ثابت از GitHub Secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD) که workflow در فایل می‌گذارد.
    // بدون آن هر ساخت با کلید debug تازه امضا می‌شد و نسخه جدید روی قبلی نصب نمی‌شد.
    def releaseKeystore = System.getenv("KEYSTORE_FILE")
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "geomat"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
